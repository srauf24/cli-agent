[project]
name = "mini-data-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.1",
    "apache-airflow>=3.1.2",
    "dbt-duckdb>=1.10.0",
    "jinja2>=3.1.4",
    "pydantic>=2.11.0",
    "rich>=13.9.4",
    "sqlparse>=0.5.2",
    "typer>=0.15.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.1",
]

[project.scripts]
mini-agent = "mini_data_platform_agent.cli:app"
